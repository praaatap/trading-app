openapi: 3.1.0
info:
  title: "VyaparTrade API"
  description: "API for the VyaparTrade stock trading platform. Handles user authentication, market data, portfolio management, and watchlists."
  version: "1.0.0"
servers:
  - url: "http://localhost:8080/api"
    description: "Local development server"

# 1. Define Tags for grouping endpoints
tags:
  - name: "Auth"
    description: "User Authentication and Profile Management"
  - name: "Market"
    description: "Public Market Data for Stocks and Indices"
  - name: "Portfolio"
    description: "User-specific Portfolio and Order Management (Requires Auth)"
  - name: "User"
    description: "User-specific data like Watchlists (Requires Auth)"

# 2. Define Paths and Operations
paths:
  # --- Auth Routes ---
  /auth/signup:
    post:
      tags:
        - Auth
      summary: "Register a new user"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Ankit Sharma"
                email:
                  type: string
                  format: email
                  example: "ankit@example.com"
                password:
                  type: string
                  format: password
                  example: "strongPassword123"
              required:
                - name
                - email
                - password
      responses:
        "201":
          description: "User registered successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: "Bad Request - Missing fields"

  /auth/signin:
    post:
      tags:
        - Auth
      summary: "Sign in a user"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: "ankit@example.com"
                password:
                  type: string
                  format: password
                  example: "strongPassword123"
              required:
                - email
                - password
      responses:
        "200":
          description: "Login successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: "Bad Request - Missing fields"
        "401":
          description: "Unauthorized - Invalid credentials"

  /auth/me:
    get:
      tags:
        - Auth
      summary: "Get current user's profile"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "User profile data"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: "Unauthorized"

  # --- Market Routes ---
  /market/indices:
    get:
      tags:
        - Market
      summary: "Get major market indices"
      responses:
        "200":
          description: "A list of market indices"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Index"

  /market/stocks:
    get:
      tags:
        - Market
      summary: "Get a list of market stocks"
      responses:
        "200":
          description: "A list of stocks"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stock"

  /market/stocks/{symbol}:
    get:
      tags:
        - Market
      summary: "Get details for a specific stock"
      parameters:
        - name: symbol
          in: path
          required: true
          description: "The stock symbol (e.g., RELIANCE)"
          schema:
            type: string
      responses:
        "200":
          description: "Detailed information for the stock"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDetail"
        "404":
          description: "Stock not found"

  # --- Portfolio Routes ---
  /portfolio/holdings:
    get:
      tags:
        - Portfolio
      summary: "Get the user's current holdings"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "A list of the user's holdings"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holding"
        "401":
          description: "Unauthorized"

  /portfolio/orders:
    post:
      tags:
        - Portfolio
      summary: "Place a buy or sell order"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  example: "TCS"
                type:
                  type: string
                  enum: [buy, sell]
                  example: "buy"
                quantity:
                  type: integer
                  example: 10
                price:
                  type: number
                  example: 3890.10
              required:
                - symbol
                - type
                - quantity
                - price
      responses:
        "201":
          description: "Order placed successfully"
        "400":
          description: "Bad Request - Missing fields"
        "401":
          description: "Unauthorized"

  # --- User Routes ---
  /user/watchlist:
    get:
      tags:
        - User
      summary: "Get the user's watchlist"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "A list of stocks in the user's watchlist"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistItem"
        "401":
          description: "Unauthorized"
    post:
      tags:
        - User
      summary: "Add a stock to the watchlist"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                  example: "TATAMOTORS"
              required:
                - symbol
      responses:
        "201":
          description: "Stock added to watchlist"
        "400":
          description: "Bad Request - Missing symbol"
        "409":
          description: "Conflict - Stock already in watchlist"

  /user/watchlist/{symbol}:
    delete:
      tags:
        - User
      summary: "Remove a stock from the watchlist"
      security:
        - bearerAuth: []
      parameters:
        - name: symbol
          in: path
          required: true
          description: "The stock symbol to remove"
          schema:
            type: string
      responses:
        "200":
          description: "Stock removed successfully"
        "404":
          description: "Stock not found in watchlist"
        "401":
          description: "Unauthorized"

# 3. Define Reusable Components
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: "user123"
        name:
          type: string
          example: "Ankit Sharma"
        email:
          type: string
          format: email
          example: "ankit@example.com"
    Stock:
      type: object
      properties:
        symbol:
          type: string
          example: "RELIANCE"
        name:
          type: string
          example: "Reliance Industries"
        ltp:
          type: number
          description: "Last Traded Price"
          example: 2950.75
        change:
          type: number
          example: 12.30
        changePercent:
          type: number
          example: 0.42
    StockDetail:
      allOf:
        - $ref: "#/components/schemas/Stock"
        - type: object
          properties:
            open:
              type: number
              example: 2938.45
            high:
              type: number
              example: 2960.00
            low:
              type: number
              example: 2935.10
            volume:
              type: integer
              example: 5234876
    Index:
      type: object
      properties:
        name:
          type: string
          example: "NIFTY 50"
        value:
          type: number
          example: 22967.65
        change:
          type: number
          example: 75.95
        changePercent:
          type: number
          example: 0.33
    Holding:
      type: object
      properties:
        symbol:
          type: string
          example: "RELIANCE"
        quantity:
          type: integer
          example: 50
        avgPrice:
          type: number
          description: "Average buy price"
          example: 2800.50
        ltp:
          type: number
          description: "Last Traded Price"
          example: 2950.75
    WatchlistItem:
      type: object
      properties:
        symbol:
          type: string
          example: "TATAMOTORS"
        ltp:
          type: number
          example: 980.70
        changePercent:
          type: number
          example: 1.2
    AuthResponse:
      type: object
      properties:
        message:
          type: string
          example: "Login successful!"
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: "#/components/schemas/User"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
